# Direct AIM control only. Corporate upstream: UNSUPPORTED / UNADVERTISED (V4).
http_port 3128
pid_filename /tmp/squid.pid
cache_log /dev/null
access_log none
cache_store_log none
cache deny all
via off
forwarded_for delete
acl gateway_source src 172.30.196.2/32
acl CONNECT method CONNECT
acl tls_port port 443
acl aim_control dstdomain api.ai.market
http_access allow gateway_source CONNECT tls_port aim_control
http_access deny all
# No cache_peer and no fallback to an unrestricted corporate proxy.
