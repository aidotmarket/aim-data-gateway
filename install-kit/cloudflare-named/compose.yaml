{
  "services": {
    "named-tunnel": {
      "profiles": ["unadvertised-cloudflare-named"],
      "image": "${CLOUDFLARED_IMAGE:?A signed helper image pin is required}",
      "user": "65532:65532",
      "read_only": true,
      "cap_drop": ["ALL"],
      "security_opt": ["no-new-privileges:true"],
      "sysctls": {"net.ipv4.ip_forward": "0"},
      "command": ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yaml", "run"],
      "volumes": [
        "./cloudflare-named/config.yaml:/etc/cloudflared/config.yaml:ro",
        "${TUNNEL_CREDENTIAL_FILE:?Choose the protected local credential file}:/run/credentials/tunnel.json:ro"
      ],
      "networks": {"gateway": {"ipv4_address": "172.30.196.5"}, "tunnel-outbound": {}}
    }
  },
  "networks": {"tunnel-outbound": {}}
}
