{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Seller-owned outbound AWS verifier. Preflight the scope with scripts/aws-verifier-scope.py before generating quick-create. JSON syntax is valid YAML.",
  "Parameters": {
    "ConnectionId": {
      "Type": "String",
      "AllowedPattern": "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
    },
    "Bucket": {
      "Type": "String",
      "MinLength": 3,
      "MaxLength": 63,
      "AllowedPattern": "[a-z0-9][a-z0-9.-]*[a-z0-9]"
    },
    "BucketRegion": {
      "Type": "String",
      "AllowedValues": [
        "eu-north-1",
        "eu-west-1",
        "eu-central-1",
        "us-east-1",
        "us-west-2"
      ]
    },
    "ReadKeys": {
      "Type": "CommaDelimitedList",
      "Default": "",
      "AllowedPattern": "[^,\\x00-\\x1f\\x7f*?\"\\\\]*",
      "Description": "Exact keys; empty for no keys. Run aws-verifier-scope.py before setup."
    },
    "ReadPrefixes": {
      "Type": "CommaDelimitedList",
      "Default": "",
      "AllowedPattern": "[^,\\x00-\\x1f\\x7f*?\"\\\\]*",
      "Description": "Exact prefixes; compiler appends only the required trailing IAM wildcard."
    },
    "SseKmsKeyArn": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|arn:aws:kms:(eu-north-1|eu-west-1|eu-central-1|us-east-1|us-west-2):[0-9]{12}:key/[0-9a-f-]{36}"
    },
    "RegistrationToken": {
      "Type": "String",
      "AllowedPattern": "[A-Za-z0-9_-]{43}",
      "Description": "Single-use token, expires after 30 minutes; visible in seller stack parameters and browser history."
    },
    "PollIntervalMinutes": {
      "Type": "Number",
      "Default": 1,
      "AllowedValues": [
        1,
        5,
        15
      ]
    },
    "MemorySize": {
      "Type": "Number",
      "Default": 1769,
      "AllowedValues": [
        1769,
        3008
      ]
    },
    "ArtifactBucket": {
      "Type": "String",
      "AllowedPattern": "[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]"
    },
    "ArtifactKey": {
      "Type": "String",
      "AllowedPattern": "aws-verifier/[A-Za-z0-9_.-]+/[0-9a-f]{64}/bootstrap.zip"
    },
    "ArtifactObjectVersion": {
      "Type": "String",
      "MinLength": 1,
      "AllowedPattern": "(?!null$).+"
    },
    "ExpectedCodeHash": {
      "Type": "String",
      "AllowedPattern": "sha256:[0-9a-f]{64}"
    },
    "ScannerVersion": {
      "Type": "String",
      "MaxLength": 128,
      "AllowedPattern": "[A-Za-z0-9_.-]+"
    },
    "ApiBaseUrl": {
      "Type": "String",
      "Default": "https://api.ai.market",
      "AllowedValues": [
        "https://api.ai.market"
      ]
    }
  },
  "Rules": {
    "SameRegion": {
      "Assertions": [
        {
          "Assert": {
            "Fn::Equals": [
              {
                "Ref": "BucketRegion"
              },
              {
                "Ref": "AWS::Region"
              }
            ]
          },
          "AssertDescription": "Deploy in the supported connection/bucket region."
        }
      ]
    }
  },
  "Conditions": {
    "HasKms": {"Fn::Not":[{"Fn::Equals":[{"Ref":"SseKmsKeyArn"},""]}]},
    "OneMinute": {"Fn::Equals":[{"Ref":"PollIntervalMinutes"},1]},
    "ReadKeys0": {"Fn::Not":[{"Fn::Equals":[{"Fn::Select":[0,{"Fn::Split":[",",{"Fn::Join":["",[{"Fn::Join":[",",{"Ref":"ReadKeys"}]},",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]}]}]},""]}]},
    "ReadKeys1": {"Fn::Not":[{"Fn::Equals":[{"Fn::Select":[1,{"Fn::Split":[",",{"Fn::Join":["",[{"Fn::Join":[",",{"Ref":"ReadKeys"}]},",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]}]}]},""]}]},
