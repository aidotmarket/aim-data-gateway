              "Action": "sts:AssumeRole",
              "Condition": {
                "StringEquals": {
                  "aws:SourceAccount": {
                    "Ref": "AWS::AccountId"
                  },
                  "aws:SourceArn": {
                    "Fn::Sub": "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default"
                  }
                }
              }
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "invoke-verifier",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "lambda:InvokeFunction"
                  ],
                  "Resource": {
                    "Fn::GetAtt": [
                      "VerifierFunction",
                      "Arn"
                    ]
                  }
                }
              ]
            }
          }
        ]
      }
    },
    "PollSchedule": {
      "Type": "AWS::Scheduler::Schedule",
      "Properties": {
        "Name": {
          "Fn::Sub": "aim-aws-verifier-${ConnectionId}"
        },
        "GroupName": "default",
        "State": "ENABLED",
        "ScheduleExpression": {
          "Fn::If": [
            "OneMinute",
            "rate(1 minute)",
            {
              "Fn::Sub": "rate(${PollIntervalMinutes} minutes)"
            }
          ]
        },
        "FlexibleTimeWindow": {
          "Mode": "OFF"
        },
        "Target": {
          "Arn": {
            "Fn::GetAtt": [
              "VerifierFunction",
              "Arn"
            ]
          },
          "RoleArn": {
            "Fn::GetAtt": [
              "ScheduleRole",
              "Arn"
            ]
          },
          "RetryPolicy": {
            "MaximumRetryAttempts": 0
          }
        }
      }
    }
  }
}
