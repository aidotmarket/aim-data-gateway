name: AWS verifier release
on:
  push:
    tags: ['aws-verifier-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver for a local build only (no publication)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install checksum-pinned RTK without a shell bootstrap
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs'), path = require('path'), crypto = require('crypto');
            const response = await fetch('https://github.com/rtk-ai/rtk/releases/download/v0.34.3/rtk-x86_64-unknown-linux-musl.tar.gz');
            if (!response.ok) throw new Error('RTK download failed');
            const bytes = Buffer.from(await response.arrayBuffer());
            if (crypto.createHash('sha256').update(bytes).digest('hex') !== 'a607c17bfdccc1d48dc94ca81cd3a545523329df6a378368fd175d8023425ea5') throw new Error('RTK checksum mismatch');
            // This checksum-pinned archive has exactly one regular file, rtk.
            const tar = require('zlib').gunzipSync(bytes);
            const name = tar.subarray(0, 100).toString().replace(/\0.*$/, '');
            const size = parseInt(tar.subarray(124, 136).toString().replace(/\0.*$/, '').trim(), 8);
            if (name !== 'rtk' || tar[156] !== 48 || size !== 9406336) throw new Error('RTK archive layout mismatch');
            const directory = path.join(process.env.RUNNER_TEMP, 'rtk');
            fs.mkdirSync(directory);
            fs.writeFileSync(path.join(directory, 'rtk'), tar.subarray(512, 512 + size), {mode: 0o755});
            core.addPath(directory);
      - name: Check RTK
        run: rtk --version
      - name: Build twice and compare ZIP digests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          rtk proxy python3 - <<'PY'
          import os, subprocess
          version = os.environ['BUILD_VERSION'] or os.environ['RELEASE_TAG'].removeprefix('aws-verifier-v')
          subprocess.run(['rtk', 'proxy', 'bash', 'scripts/aws-verifier-release.sh', '--version', version], check=True)
          PY
      - name: Install checksum-pinned Syft, Grype and Cosign
        if: github.event_name == 'push'
        run: |
          rtk proxy python3 - <<'PY'
          import hashlib, os, pathlib, tarfile, urllib.request
          tools = pathlib.Path(os.environ['RUNNER_TEMP']) / 'aws-verifier-tools'
          tools.mkdir()
          downloads = [
            ('syft', 'https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz', 'caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d'),
            ('grype', 'https://github.com/anchore/grype/releases/download/v0.119.0/grype_0.119.0_linux_amd64.tar.gz', '3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b'),
            ('cosign', 'https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64', '4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71')]
          for name, url, expected in downloads:
            path = tools / (name + '.download')
            urllib.request.urlretrieve(url, path)
            if hashlib.sha256(path.read_bytes()).hexdigest() != expected:
              raise SystemExit(name + ' checksum mismatch')
            if name == 'cosign':
              path.rename(tools / name)
            else:
              with tarfile.open(path) as archive:
                archive.extract(name, tools, filter='data')
            (tools / name).chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a') as output:
            output.write(str(tools) + '\n')
          PY
      - name: Assume existing publisher role through GitHub OIDC
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_VERIFIER_PUBLISH_ROLE_ARN }}
          aws-region: eu-north-1
      - name: Verify existing regional smoke functions, sign and publish
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ARTIFACT_MANIFEST: ${{ vars.AWS_VERIFIER_ARTIFACT_MANIFEST }}
          AWS_PAGER: ''
        run: |
          rtk proxy python3 - <<'PY'
          import json, os, pathlib, subprocess
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'aws-verifier-regions.json'
          path.write_text(json.dumps(json.loads(os.environ['ARTIFACT_MANIFEST'])))
          subprocess.run(['rtk', 'proxy', 'bash', 'scripts/aws-verifier-release.sh', '--version',
                          os.environ['RELEASE_TAG'].removeprefix('aws-verifier-v'),
                          '--mode', 'publish-built', '--manifest', str(path)], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: aws-verifier-release
          path: dist/aws-verifier/
          if-no-files-found: error
