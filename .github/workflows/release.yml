name: Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v<semver> tag to build without publishing'
        required: true
        type: string
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate release input
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          test "$GITHUB_REPOSITORY" = aidotmarket/aim-data-gateway
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/$TAG")"
      - name: Check Compose hardening
        run: python3 scripts/check-compose.py --self-check
      - name: Set up pinned Buildx builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
          use: true
      - name: Build twice and compare image digests
        id: build
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          MODE: ${{ github.event_name == 'push' && 'push' || 'dry-run' }}
        run: |
          bash scripts/release-image.sh
          echo "digest=$(cat build-check/digest)" >> "$GITHUB_OUTPUT"
      - name: Install checksum-pinned Syft and Grype
        run: |
          mkdir -p "$RUNNER_TEMP/gateway-tools"
          curl -fsSL -o "$RUNNER_TEMP/gateway-tools/syft.tar.gz" https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz
          echo 'caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d  '"$RUNNER_TEMP/gateway-tools/syft.tar.gz" | sha256sum -c -
          curl -fsSL -o "$RUNNER_TEMP/gateway-tools/grype.tar.gz" https://github.com/anchore/grype/releases/download/v0.119.0/grype_0.119.0_linux_amd64.tar.gz
          echo '3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b  '"$RUNNER_TEMP/gateway-tools/grype.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gateway-tools/syft.tar.gz" -C "$RUNNER_TEMP/gateway-tools" syft
          tar -xzf "$RUNNER_TEMP/gateway-tools/grype.tar.gz" -C "$RUNNER_TEMP/gateway-tools" grype
          echo "$RUNNER_TEMP/gateway-tools" >> "$GITHUB_PATH"
      - name: Generate SPDX SBOM and scan fixable high or critical findings
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          target='oci-archive:build-check/image-1.oci.tar'
          syft "$target" -o spdx-json=dist/aim-gateway.spdx.json
          grype "sbom:dist/aim-gateway.spdx.json" --only-fixed --fail-on high
      - name: Push verified image and compare registry digest
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          bash scripts/push-release-image.sh
      - name: Check anonymous manifest pull
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          anonymous_docker_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_docker_config"' EXIT
          if ! DOCKER_CONFIG="$anonymous_docker_config" docker manifest inspect "ghcr.io/aidotmarket/aim-gateway@$DIGEST" > /dev/null; then
            echo '::error::Anonymous GHCR pull failed. An aidotmarket org admin must make the ghcr.io/aidotmarket/aim-gateway package public, then rerun this release workflow.'
            exit 1
          fi
      - name: Install checksum-pinned Cosign
        if: github.event_name == 'push'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gateway-tools/cosign" https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo '4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  '"$RUNNER_TEMP/gateway-tools/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/gateway-tools/cosign"
      - name: Sign and verify pushed image
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="ghcr.io/aidotmarket/aim-gateway@$DIGEST"
          cosign sign --yes "$image"
          cosign verify "$image" \
            --certificate-identity-regexp '^https://github\.com/aidotmarket/aim-data-gateway/\.github/workflows/release\.yml@refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Attest pushed SBOM
        if: github.event_name == 'push'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/aidotmarket/aim-gateway
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: dist/aim-gateway.spdx.json
          push-to-registry: true
      - name: Attest pushed build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/aidotmarket/aim-gateway
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify GitHub attestations
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          subject="oci://ghcr.io/aidotmarket/aim-gateway@$DIGEST"
          gh attestation verify "$subject" -R "$GITHUB_REPOSITORY" \
            --signer-workflow aidotmarket/aim-data-gateway/.github/workflows/release.yml \
            --source-ref "refs/tags/$TAG" --predicate-type https://spdx.dev/Document/v2.3
          gh attestation verify "$subject" -R "$GITHUB_REPOSITORY" \
            --signer-workflow aidotmarket/aim-data-gateway/.github/workflows/release.yml \
            --source-ref "refs/tags/$TAG" --predicate-type https://slsa.dev/provenance/v1
      - name: Prepare verified release assets
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 scripts/render-release-compose.py "$DIGEST" dist/compose.yaml
          python3 scripts/check-compose.py dist/compose.yaml
          cd dist
          sha256sum aim-gateway.spdx.json compose.yaml > checksums.txt
          echo "Image: ghcr.io/aidotmarket/aim-gateway@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: release-assets
          path: |
            dist/aim-gateway.spdx.json
            dist/compose.yaml
            dist/checksums.txt
          if-no-files-found: error
  github-release:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release assets require this; the image job stays read-only.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/aim-gateway.spdx.json dist/compose.yaml dist/checksums.txt --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
