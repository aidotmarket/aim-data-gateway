name: Cloudflare verifier release
on:
  push:
    tags: ['cloudflare-verifier-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver for candidate artifact build (no publication)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: deploy/cloudflare-verifier/package-lock.json
      - name: Fetch pinned dependencies before offline checks
        run: |
          go mod download
          npm ci --prefix deploy/cloudflare-verifier
      - name: Offline adapter, shared contract and Worker storage checks
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          go test ./internal/cloudflareverification ./cmd/aim-cloudflare-verifier ./internal/awsverification ./internal/wire ./verification
          go test -race ./internal/cloudflareverification
          npm --prefix deploy/cloudflare-verifier run types
          npm --prefix deploy/cloudflare-verifier test
          python3 scripts/check-vector-digest.py
          python3 scripts/check-module-budget.py
          python3 scripts/count-lines.py
      - name: Build binary and bundle twice and export frozen template
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          version = os.environ['BUILD_VERSION'] or os.environ['RELEASE_TAG'].removeprefix('cloudflare-verifier-v')
          subprocess.run(['python3', 'scripts/cloudflare-verifier-release.py', '--version', version,
                          '--verify-committed'], check=True)
          PY
      - name: Offline release template contract checks
        run: python3 -m unittest discover -s scripts -p test_cloudflare_verifier_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloudflare-verifier-build
          path: dist/cloudflare-verifier/
          include-hidden-files: true
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cloudflare-verifier-build
          path: dist/cloudflare-verifier/
      - name: Install checksum-pinned Syft, Grype and Cosign
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, tarfile, urllib.request
          tools = pathlib.Path(os.environ['RUNNER_TEMP']) / 'aws-verifier-tools'
          tools.mkdir()
          downloads = [
            ('syft', 'https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz', 'caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d'),
            ('grype', 'https://github.com/anchore/grype/releases/download/v0.119.0/grype_0.119.0_linux_amd64.tar.gz', '3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b'),
            ('cosign', 'https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64', '4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71')]
          for name, url, expected in downloads:
            path = tools / (name + '.download')
            urllib.request.urlretrieve(url, path)
            if hashlib.sha256(path.read_bytes()).hexdigest() != expected:
              raise SystemExit(name + ' checksum mismatch')
            if name == 'cosign':
              path.rename(tools / name)
            else:
              with tarfile.open(path) as archive:
                archive.extract(name, tools, filter='data')
            (tools / name).chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a') as output:
            output.write(str(tools) + '\n')
          PY
      - name: Generate SBOM, sign and verify artifact bytes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import importlib.util, os, pathlib
          spec = importlib.util.spec_from_file_location('release', 'scripts/cloudflare-verifier-release.py')
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          release.sign(pathlib.Path('dist/cloudflare-verifier').resolve(),
                       os.environ['RELEASE_TAG'].removeprefix('cloudflare-verifier-v'))
          PY
      - name: Publish artifacts in this repository only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          files = [str(p) for p in pathlib.Path('dist/cloudflare-verifier').iterdir() if p.is_file()]
          subprocess.run(['gh', 'release', 'create', os.environ['RELEASE_TAG'], '--verify-tag',
                          '--title', os.environ['RELEASE_TAG'], '--notes',
                          'Candidate verifier artifacts. No external template repository created; real-account acceptance remains outstanding.', *files], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cloudflare-verifier-release
          path: dist/cloudflare-verifier/
          include-hidden-files: true
          if-no-files-found: error
